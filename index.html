<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="供应商助手">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>航班管家供应商运营助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1>✈️ 供应商运营助手</h1>
      </div>
      <div class="header-right">
        <button id="clearBtn" class="icon-btn" title="新对话">↺</button>
        <button id="settingsBtn" class="icon-btn" title="设置">⚙️</button>
      </div>
    </header>

    <!-- Chat -->
    <div id="chatArea" class="chat-area">
      <div id="chatList"></div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <textarea id="chatInput" rows="1" placeholder="输入你的问题，例如：怎么处理退票拒单？"></textarea>
      <button id="sendBtn" class="send-btn">↑</button>
    </div>

    <!-- Settings Overlay -->
    <div id="settingsOverlay" class="overlay">
      <div class="overlay-top">
        <button id="closeSettingsBtn" class="icon-btn">✕</button>
        <span>设置</span>
        <span class="spacer"></span>
      </div>
      <div class="overlay-scroll">
        <div class="settings-body">
          <p class="info-box">默认 AI 已配置好，直接使用即可。<br>如需用自己的 Key，点下方按钮设置。</p>
          <div class="setting-row">
            <label>API Key</label>
            <input type="password" id="apiKeyInput" class="setting-input" placeholder="输入智谱 API Key">
          </div>
          <button id="saveKeyBtn" class="btn-primary">保存自定义 Key</button>
          <button id="resetKeyBtn" class="btn-outline">恢复默认 Key</button>
          <p style="text-align:center;margin-top:24px;font-size:11px;color:var(--text3);">知识库基于航班管家供应商常见问题Q&A</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/knowledge.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
